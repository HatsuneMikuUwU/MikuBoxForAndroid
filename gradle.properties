org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# The ported MikuRay screens are written against resource names that now live in
# :mikuray-ui and :remixicon, so one merged R namespace keeps their Kotlin
# readable (R.layout.uwu_mid rather than com.miku.ray.res.R.layout.uwu_mid) and
# matches how the vendored XML addresses them.
android.nonTransitiveRClass=false

kotlin.code.style=official

# Single source of the app version. :app (package versionName/versionCode and
# the banner resValues) and :mikuray-ui (BuildConfig.VERSION_NAME/VERSION_CODE,
# the about screen and the uwu_version_* resources) both read these, so they
# cannot drift apart again (they once did: 0.2.3/203 vs 0.2.2/202). Release
# workflows still win with -PversionNameOverride/-PversionCodeOverride.
appVersionName=0.2.4
appVersionCode=204
