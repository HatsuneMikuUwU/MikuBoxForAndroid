[versions]
agp = "8.13.2"
kotlin = "2.4.21"
ksp = "2.3.10"

coroutines = "1.10.2"
coreSplashscreen = "1.0.1"
coreKtx = "1.17.0"
recyclerview = "1.3.0"
activity = "1.11.0"
fragment = "1.8.9"
browser = "1.5.0"
swiperefreshlayout = "1.1.0"
appcompat = "1.7.1"
work = "2.10.1"
lifecycle = "2.9.2"
room = "2.7.1"

composeBom = "2025.12.01"
material = "1.14.0"
gson = "2.13.1"

preferencex = "1.1.0"
lottie = "4.2.2"
glide = "5.0.5"
ucrop = "2.2.11"
speedviewlib = "1.6.1"
zxingLite = "2.1.1"
editorkit = "2.6.0"

okhttp = "5.0.0-alpha.3"
snakeyaml = "1.30"
processPhoenix = "2.1.2"
kryo = "5.2.1"
guava = "31.0.1-android"
ini4j = "0.5.4"
recyclerviewFastscroll = "2.0.1"
roomigrant = "0.3.4"
desugarJdkLibs = "2.0.3"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
# Kotlin & Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# AndroidX Core & UI
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-multiprocess = { module = "androidx.work:work-multiprocess", version.ref = "work" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Jetpack Compose & Material 3 Expressive
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

# Google Material & Utilities
google-material = { module = "com.google.android.material:material", version.ref = "material" }
google-gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
google-guava = { module = "com.google.guava:guava", version.ref = "guava" }

# Room & Migrations
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
roomigrant-lib = { module = "com.github.MatrixDev.Roomigrant:RoomigrantLib", version.ref = "roomigrant" }
roomigrant-compiler = { module = "com.github.MatrixDev.Roomigrant:RoomigrantCompiler", version.ref = "roomigrant" }

# Preference & Widgets
preferencex = { module = "com.takisoft.preferencex:preferencex", version.ref = "preferencex" }
preferencex-simplemenu = { module = "com.takisoft.preferencex:preferencex-simplemenu", version.ref = "preferencex" }
recyclerview-fastscroll = { module = "com.simplecityapps:recyclerview-fastscroll", version.ref = "recyclerviewFastscroll" }

# Media, Editor & Tools
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
ucrop = { module = "com.github.yalantis:ucrop", version.ref = "ucrop" }
speedviewlib = { module = "com.github.anastr:speedviewlib", version.ref = "speedviewlib" }
zxing-lite = { module = "com.github.jenly1314:zxing-lite", version.ref = "zxingLite" }
editorkit = { module = "com.blacksquircle.ui:editorkit", version.ref = "editorkit" }
editorkit-language-base = { module = "com.blacksquircle.ui:language-base", version.ref = "editorkit" }
editorkit-language-json = { module = "com.blacksquircle.ui:language-json", version.ref = "editorkit" }

# Networking & Serialization
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
process-phoenix = { module = "com.jakewharton:process-phoenix", version.ref = "processPhoenix" }
kryo = { module = "com.esotericsoftware:kryo", version.ref = "kryo" }
ini4j = { module = "org.ini4j:ini4j", version.ref = "ini4j" }

# Desugaring
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[bundles]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-foundation",
    "androidx-compose-material3",
    "androidx-activity-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
]
editorkit = [
    "editorkit",
    "editorkit-language-base",
    "editorkit-language-json",
]
