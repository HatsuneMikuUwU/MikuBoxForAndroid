
name: Debug Build & Multi-Arch Release

on:
  workflow_dispatch:

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25

      - name: Generate Status Files
        run: |
          find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
          git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x run
          ./run lib core

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || github.actor == 'HSSkyBoy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate Status Files
        run: |
          find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
          git ls-files libcore | xargs cat | sha1sum > libcore_status
      
      - name: Restore LibCore Cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk-bundle" >> local.properties
          
          chmod +x run gradlew
          ./run init action gradle
          
          ./gradlew app:assemblePreviewDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.internal.http.socketTimeout=120000 \
            -Dorg.gradle.internal.http.connectionTimeout=120000

          mkdir -p final_apks
          find app/build/outputs/apk -name "*debug.apk" -exec cp {} final_apks/ \;
          
          if [ -z "$(ls -A final_apks)" ]; then
            exit 1
          fi

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MikuBox-All-Architectures-Debug
          path: final_apks/

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.4.3-UwU-tr-${{ github.run_number }}
          name: "MikuBox Preview Build #${{ github.run_number }}"
          body: |
            ### Build Information
            - **Build Status:** Success
            - **Build Number:** ${{ github.run_number }}
            - **Signature:** Debug (Unsigned)
            - **Date:** ${{ github.event.head_commit.timestamp }}
            
            This is an automated preview build.
          draft: false
          prerelease: true
          files: final_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

