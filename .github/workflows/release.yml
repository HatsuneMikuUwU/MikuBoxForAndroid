name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Publish the APKs to GitHub Releases"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  libcore:
    uses: ./.github/workflows/libcore.yml

  build:
    name: Build MikuBox APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore Artifact
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.3.13750724" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleMikuboxRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: MikuBox-arm64-v8a
          path: ${{ env.APK }}/*-arm64-v8a*.apk
          if-no-files-found: error
      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: MikuBox-armeabi-v7a
          path: ${{ env.APK }}/*-armeabi-v7a*.apk
          if-no-files-found: error
      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: MikuBox-x86_64
          path: ${{ env.APK }}/*-x86_64*.apk
          if-no-files-found: error
  publish:
    name: Publish Release
    if: inputs.publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MikuBox-*
          path: artifacts
          merge-multiple: true
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.13.0/ghr_v0.13.0_linux_amd64.tar.gz
          tar -xvf ghr.tar.gz
          mv ghr*linux_amd64/ghr .
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          ./ghr -delete -t "$GITHUB_TOKEN" -n "$TAG" "$TAG" apks
