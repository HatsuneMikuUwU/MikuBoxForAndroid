name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APKs
    runs-on: ubuntu-latest
    steps:
      # The core/mihomo submodule is pinned to a HSSkyBoy/mihomo fork commit.
      # Make sure that fork's `Alpha` branch (with the naive outbound) is pushed
      # to the remote, otherwise this checkout can't fetch the pinned commit.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Fails the build when a locale falls behind the base resources again
      # (in/ru were 301/288 keys behind before the 2026-10-02 backfill).
      - name: Check locale key coverage
        run: python3 tools/locale-coverage.py --ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: core/mihomo-bridge/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;29.0.13599879" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          fi

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:testMihomoBridge --console=plain

      - name: Build debug APKs (per-ABI)
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mikubox-cla-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
