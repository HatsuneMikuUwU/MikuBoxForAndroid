name: Pre-release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag name"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  libcore:
    uses: ./.github/workflows/libcore.yml

  build:
    name: Build Preview APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore Artifact
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.3.13750724" >> local.properties
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: MikuBox-arm64-v8a
          path: ${{ env.APK }}/*-arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: MikuBox-armeabi-v7a
          path: ${{ env.APK }}/*-armeabi-v7a*.apk
          if-no-files-found: error

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: MikuBox-x86_64
          path: ${{ env.APK }}/*-x86_64*.apk
          if-no-files-found: error

      - name: Prepare all APK variants
        run: |
          mkdir -p all_apks
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} all_apks/ \;
          echo "APK_DIR=all_apks" >> $GITHUB_ENV

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: true
          files: |
            ${{ env.APK_DIR }}/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
